---
## Lint scenario: rpcv2 with short retention. The live data lives in an emptyDir on
## a tainted NVMe node pool. The TOML is rendered from rpcv2Config as-is.
global:
  image:
    sorobanRpc:
      ## Placeholder for the lint scenario. v2 requires a tag; no image is pulled here.
      tag: rpcv2-placeholder
sorobanRpc:
  rpcVersion: v2
  configFileName: rpc-v2.toml
  tolerations:
    - key: dedicated
      operator: Equal
      value: rpc-v2
      effect: NoSchedule
  nodeSelector:
    dedicated: rpc-v2
  persistence:
    enabled: true
    type: emptyDir
    emptyDir:
      sizeLimit: 400Gi
  rpcv2Config:
    storage:
      default_data_dir: /var/lib/stellar/rpc-v2
    retention:
      earliest_ledger: "now"
      retention_chunks: 15
    service:
      endpoint: "0.0.0.0:8000"
      admin_endpoint: "0.0.0.0:6061"
    backfill:
      datastore:
        type: S3
        params:
          destination_bucket_path: "aws-public-blockchain/v1.1/stellar/ledgers/pubnet"
          region: us-east-2
    ingestion:
      captive_core_config: /config/stellar-captive-core.cfg
      history_archive_urls:
        - https://history.stellar.org/prd/core-live/core_live_001
  ingress:
    enabled: false
