---
## Lint scenario: rpcv2 with full history. Same NVMe emptyDir for the live data, plus
## the cold-storage PVC for the ledgers and events, pointed at from rpcv2Config.storage.
global:
  image:
    sorobanRpc:
      ## Placeholder for the lint scenario. v2 requires a tag; no image is pulled here.
      tag: rpcv2-placeholder
sorobanRpc:
  rpcVersion: v2
  configFileName: rpc-v2.toml
  tolerations:
    - key: dedicated
      operator: Equal
      value: rpc-v2
      effect: NoSchedule
  nodeSelector:
    dedicated: rpc-v2
  persistence:
    enabled: true
    type: emptyDir
    emptyDir:
      sizeLimit: 400Gi
    persistentVolumeClaimRetentionPolicy:
      whenDeleted: Retain
      whenScaled: Retain
    coldStorage:
      enabled: true
      storageClass: default
      size: 10Ti
  rpcv2Config:
    ## All seven rpcv2 stores, split across the two disks. The hot tier (live RocksDB for
    ## chunks not yet packed) and the catalog (which chunks the node holds) stay on NVMe.
    ## Every packed, immutable store and its indexes go to the cold-storage PVC.
    storage:
      default_data_dir: /var/lib/stellar/rpc-v2
      hot: /var/lib/stellar/rpc-v2/hot
      catalog: /var/lib/stellar/rpc-v2/catalog/rocksdb
      ledgers: /var/lib/stellar-cold-storage/ledgers
      events: /var/lib/stellar-cold-storage/events
      events_index: /var/lib/stellar-cold-storage/events_index
      txhash_raw: /var/lib/stellar-cold-storage/txhash_raw
      txhash_index: /var/lib/stellar-cold-storage/txhash_index
    retention:
      earliest_ledger: "genesis"
      retention_chunks: 0
    service:
      endpoint: "0.0.0.0:8000"
      admin_endpoint: "0.0.0.0:6061"
    backfill:
      datastore:
        type: S3
        params:
          destination_bucket_path: "aws-public-blockchain/v1.1/stellar/ledgers/pubnet"
          region: us-east-2
    ingestion:
      captive_core_config: /config/stellar-captive-core.cfg
      history_archive_urls:
        - https://history.stellar.org/prd/core-live/core_live_001
  ingress:
    enabled: false
