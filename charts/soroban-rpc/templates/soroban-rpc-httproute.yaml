{{- if .Values.sorobanRpc.httpRoute.enabled }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ template "common.fullname" . }}
  {{- if .Release.Namespace }}
  namespace: {{ .Release.Namespace }}
  {{- end }}
  {{- if .Values.sorobanRpc.httpRoute.annotations }}
  annotations:
    {{- range $key, $value := .Values.sorobanRpc.httpRoute.annotations }}
    {{ $key }}: {{ $value | quote }}
    {{- end }}
  {{- end }}
  labels:
    app: {{ template "common.fullname" . }}
    chart: {{ template "common.chart" . }}
    release: {{ .Release.Name }}
    heritage: {{ .Release.Service }}
    {{- range $key, $value := .Values.sorobanRpc.httpRoute.labels }}
    {{ $key }}: {{ $value | quote }}
    {{- end }}
spec:
  parentRefs:
    {{- if .Values.sorobanRpc.httpRoute.gateway.enabled }}
    - name: {{ .Values.sorobanRpc.httpRoute.gateway.name | default (printf "%s-gateway" (include "common.fullname" .)) }}
      {{- with .Values.sorobanRpc.httpRoute.sectionName }}
      sectionName: {{ . }}
      {{- end }}
    {{- else }}
    {{- range .Values.sorobanRpc.httpRoute.parentRefs }}
    - name: {{ .name }}
      {{- if .namespace }}
      namespace: {{ .namespace }}
      {{- end }}
      {{- if .sectionName }}
      sectionName: {{ .sectionName }}
      {{- end }}
    {{- end }}
    {{- end }}
  {{- if .Values.sorobanRpc.httpRoute.hostnames }}
  hostnames:
    {{- range .Values.sorobanRpc.httpRoute.hostnames }}
    - {{ . | quote }}
    {{- end }}
  {{- end }}
  rules:
    - backendRefs:
        - name: {{ template "common.fullname" . }}
          port: 8000
{{- if (.Values.sorobanRpc.httpRoute.httpsRedirect).enabled }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ template "common.fullname" . }}-http-redirect
  {{- if .Release.Namespace }}
  namespace: {{ .Release.Namespace }}
  {{- end }}
  {{- if .Values.sorobanRpc.httpRoute.httpsRedirect.annotations }}
  annotations:
    {{- range $key, $value := .Values.sorobanRpc.httpRoute.httpsRedirect.annotations }}
    {{ $key }}: {{ $value | quote }}
    {{- end }}
  {{- end }}
  labels:
    app: {{ template "common.fullname" . }}
    chart: {{ template "common.chart" . }}
    release: {{ .Release.Name }}
    heritage: {{ .Release.Service }}
    {{- range $key, $value := .Values.sorobanRpc.httpRoute.httpsRedirect.labels }}
    {{ $key }}: {{ $value | quote }}
    {{- end }}
spec:
  parentRefs:
    {{- range .Values.sorobanRpc.httpRoute.httpsRedirect.parentRefs }}
    - name: {{ .name }}
      {{- if .namespace }}
      namespace: {{ .namespace }}
      {{- end }}
      {{- if .sectionName }}
      sectionName: {{ .sectionName }}
      {{- end }}
    {{- end }}
  {{- $redirectHostnames := .Values.sorobanRpc.httpRoute.httpsRedirect.hostnames | default .Values.sorobanRpc.httpRoute.hostnames }}
  {{- if $redirectHostnames }}
  hostnames:
    {{- range $redirectHostnames }}
    - {{ . | quote }}
    {{- end }}
  {{- end }}
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: {{ .Values.sorobanRpc.httpRoute.httpsRedirect.statusCode | default 301 }}
{{- end }}
{{- end }}
