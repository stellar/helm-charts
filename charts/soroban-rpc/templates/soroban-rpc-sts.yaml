---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ template "common.fullname" . }}
  {{- if .Release.Namespace }}
  namespace: {{ .Release.Namespace }}
  {{- end }}
  labels:
    app: {{ template "common.fullname" . }}
    chart: {{ template "common.chart" . }}
    release: {{ .Release.Name }}
    heritage: {{ .Release.Service }}
  {{- if (.Values.sorobanRpc).statefulsetAnnotations }}
  annotations:
    {{- range $key, $value := .Values.sorobanRpc.statefulsetAnnotations }}
    {{ $key }}: {{ $value | quote }}
    {{- end }}
  {{- end }}
spec:
  # Currently Soroban RPC doesn't support HA deployments over a single shared data store
  # but, each replica pod in a statefulset will have it's own data store on it's PVC.
  # This statefulset creates two replicas which will be monitored by the readiness probe. 
  # Having two replicas also ensures zero downtime during upgrades as at least one replica is 
  # gauranteed to be running while the other one is upgraded and catching backup to network 
  # after restart
  replicas: {{ if kindIs "invalid" .Values.sorobanRpc.replicaCount }}2{{ else }}{{ .Values.sorobanRpc.replicaCount | int }}{{ end }}
  podManagementPolicy: {{ .Values.sorobanRpc.podManagementPolicy }}
  serviceName: {{ template "common.fullname" . }}
  {{- if and .Values.sorobanRpc.persistence.enabled .Values.sorobanRpc.persistence.persistentVolumeClaimRetentionPolicy }}
  persistentVolumeClaimRetentionPolicy:
    {{- toYaml .Values.sorobanRpc.persistence.persistentVolumeClaimRetentionPolicy | nindent 4 }}
  {{- end }}
  selector:
    matchLabels:
      app: {{ template "common.fullname" . }}
  template:
    metadata:
      labels:
        app: {{ template "common.fullname" . }}
        release: {{ .Release.Name }}
      {{- if (.Values.sorobanRpc).labels }}
        {{- range $key, $value := .Values.sorobanRpc.labels }}
        {{ $key }}: {{ $value | quote }}
        {{- end }}
      {{- end }}
      annotations:
        checksum/configmap: {{ include (print $.Template.BasePath "/soroban-rpc-cm.yaml") . | sha256sum }}
      {{- if (.Values.sorobanRpc).annotations }}
        {{- range $key, $value := .Values.sorobanRpc.annotations }}
        {{ $key }}: {{ $value | quote }}
        {{- end }}
      {{- end }}
    spec:
      {{- if (.Values.sorobanRpc).serviceAccountName }}
      serviceAccountName: {{ .Values.sorobanRpc.serviceAccountName | default "default" }}
      {{- end }}
      {{- if (.Values.global).imagePullSecrets }}
      imagePullSecrets:
{{ toYaml .Values.global.imagePullSecrets | indent 8 }}
      {{- end }}
      containers:
      - name: soroban-rpc
        image: {{ include "common.sorobanRpcImage" . | quote }}
        args: ["--config-path", "/config/{{ include "common.rpcConfigFileName" . }}"]
        imagePullPolicy: {{ .Values.global.image.sorobanRpc.pullPolicy }}
        volumeMounts:
        - name: config-volume
          mountPath: /config
          readOnly: true
        {{- if (.Values.sorobanRpc.persistence).enabled }}
        - name: {{ template "common.fullname" . }}-var-lib-stellar
          mountPath: /var/lib/stellar
        {{- end }}
        ports:
        - containerPort: {{ include "common.rpcPort" . }}
          name: soroban-rpc
        - containerPort: 6061
          name: admin-port
        {{- $minLedgers := (.Values.sorobanRpc.readinessProbe).minLedgers }}
        {{- if and (not (kindIs "invalid" $minLedgers)) .Values.sorobanRpc.requireFullRetentionWindow }}
        {{- fail "sorobanRpc.readinessProbe.minLedgers and sorobanRpc.requireFullRetentionWindow both gate readiness on ledger count and cannot be combined. Set only one." }}
        {{- end }}
        readinessProbe:
          exec:
            command:
              - /bin/sh
              - -c
              - |
                curl -s --location --request POST 'http://127.0.0.1:{{ include "common.rpcPort" . }}/' \
                  --header 'Content-Type: application/json' \
                  --data-raw '{
                    "jsonrpc": "2.0",
                    "id": 10235,
                    "method": "getHealth"
                  {{- if not (kindIs "invalid" $minLedgers) }}
                  }' | jq -es 'if (. | length) == 0 then null else .[0] end | .result | .status == "healthy" and (.latestLedger - .oldestLedger >= {{ $minLedgers }})' > /dev/null;
                  {{- else if .Values.sorobanRpc.requireFullRetentionWindow }}
                  }' | jq -es 'if (. | length) == 0 then null else .[0] end | .result | .status == "healthy" and (.latestLedger - .oldestLedger >= (.ledgerRetentionWindow - 10))' > /dev/null;
                  {{- else }}
                  }' | jq -es 'if (. | length) == 0 then null else .[0] end | .result | .status == "healthy"' > /dev/null;
                  {{- end }}
          failureThreshold: {{ (.Values.sorobanRpc.readinessProbe).failureThreshold | default 2 }}
          periodSeconds: {{ (.Values.sorobanRpc.readinessProbe).periodSeconds | default 10 }}
          successThreshold: {{ (.Values.sorobanRpc.readinessProbe).successThreshold | default 2 }}
          timeoutSeconds: {{ (.Values.sorobanRpc.readinessProbe).timeoutSeconds | default 5 }}
          {{- with (.Values.sorobanRpc.readinessProbe).initialDelaySeconds }}
          initialDelaySeconds: {{ . }}
          {{- end }}
        {{- if (.Values.sorobanRpc).resources }}
        resources:
{{ toYaml .Values.sorobanRpc.resources | indent 10 }}
        {{- end }}
      volumes:
      - name: config-volume
        configMap:
          name: {{ template "common.fullname" . }}
      affinity: {{- toYaml .Values.sorobanRpc.affinity | nindent 8 }}
      {{- with (.Values.sorobanRpc).nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
  {{- if (.Values.sorobanRpc.persistence).enabled }}
  volumeClaimTemplates:
  - metadata:
      name: {{ template "common.fullname" . }}-var-lib-stellar
    spec:
      accessModes: ["ReadWriteOnce"]
      storageClassName: {{ .Values.sorobanRpc.persistence.storageClass }}
      resources:
        requests:
          storage: {{ .Values.sorobanRpc.persistence.size | quote }}
  {{- end }}
