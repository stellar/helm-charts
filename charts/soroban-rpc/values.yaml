global:
  ## String to use to explicitly set namespace name in manifests.
  ## Useful for those using "helm template" to render templates
  # namespace: mynamespace

  ## String to partially override common.fullname template (will maintain the release name)
  ##
  # nameOverride:

  ## String to fully override common.fullname template
  ##
  # fullnameOverride:

  ## List of pre-existing image Pull Secrets to use
  # imagePullSecrets:
  # - imagepullsecret1
  # - imagepullsecret2

  image:
    sorobanRpc:
      registry: docker.io
      repository: stellar/stellar-rpc
      ## Optional tag. Defaults to the appVersion from Chart.yaml
      # tag: abc123

      ## Specify a imagePullPolicy
      ## Defaults to 'Always' if image tag is 'latest', else set to 'IfNotPresent'
      ## ref: http://kubernetes.io/docs/user-guide/images/#pre-pulling-images
      ##
      pullPolicy: Always

sorobanRpc:
  ## See global.image.sorobanRpc for image settings

  ## Port the RPC JSON-RPC endpoint listens on.
  port: 8000

  ## File name of the generated RPC config.
  configFileName: soroban-rpc.cfg

  ## Path to the RPC sqlite database inside the container.
  dbPath: /var/lib/stellar/soroban-rpc-db.sqlite

  ## Controls whether readiness probe will require retention window to be full before
  ## marking pods as Ready. Mutually exclusive with readinessProbe.minLedgers.
  requireFullRetentionWindow: false

  ## Readiness probe timings. The probe itself is a getHealth JSON-RPC call and is not
  ## configurable; only these thresholds are. Defaults are shown.
  # readinessProbe:
  #   failureThreshold: 2
  #   periodSeconds: 10
  #   successThreshold: 2
  #   timeoutSeconds: 5
  #   initialDelaySeconds: 30   # omitted entirely when unset
  #   ## Require at least this many ledgers of history before marking pods Ready.
  #   ## A fixed alternative to requireFullRetentionWindow; setting both fails.
  #   minLedgers: 5

  ## For production use cases we recommend at least 2 replicas
  replicaCount: 2

  ## Which stellar-rpc the pod runs.
  ##   "v1"  the released stellar-rpc. The config file is built from sorobanRpcConfig as
  ##         KEY=VALUE lines. Args: --config-path.
  ##   "v2"  rpcv2, the full-history stellar-rpc (not GA). The config file is rpcv2Config
  ##         rendered as TOML. Args: --enable-rpcv2 --config-path.
  ## v2 needs an image built with rpcv2 enabled. Every published stellar/stellar-rpc tag
  ## refuses --enable-rpcv2, so v2 requires global.image.sorobanRpc.tag to be set.
  ## sorobanRpcConfig is ignored in v2, rpcv2Config is ignored in v1. coreConfig renders
  ## the captive-core file in both modes.
  rpcVersion: v1

  ## Free-form rpcv2 configuration, rendered as TOML with toToml. Only used when rpcVersion
  ## is v2. Every key in stellar-rpc's rpc-v2-sample-config.toml is valid here and nothing
  ## else is needed: backfill, retention and storage paths are ordinary keys in this map.
  ## The chart adds no key of its own. It only checks that:
  ##   - service.endpoint ends with ":<sorobanRpc.port>", so the Service and the readiness
  ##     probe reach the daemon. Set service.admin_endpoint to "0.0.0.0:6061" for metrics;
  ##     that is the admin container port.
  ## requireFullRetentionWindow works in v2; getHealth reports ledgerRetentionWindow.
  rpcv2Config: {}
  # rpcv2Config:
  #   storage:
  #     default_data_dir: /var/lib/stellar/rpc-v2
  #   retention:
  #     earliest_ledger: "now"
  #     retention_chunks: 15
  #   service:
  #     endpoint: "0.0.0.0:8000"
  #     admin_endpoint: "0.0.0.0:6061"
  #   ingestion:
  #     captive_core_config: /config/stellar-captive-core.cfg
  #     history_archive_urls:
  #       - https://history.stellar.org/prd/core-live/core_live_001

  ## Soroban-rpc config variables (rpcVersion v1 only)
  sorobanRpcConfig:
    friendbotUrl: "https://friendbot-futurenet.stellar.org/"
    networkPassphrase: "Test SDF Future Network ; October 2022"
    historyArchiveUrls: "http://history.stellar.org/dev/core-futurenet/core_futurenet_001,http://history.stellar.org/dev/core-futurenet/core_futurenet_002,http://history.stellar.org/dev/core-futurenet/core_futurenet_003"
    checkpointFrequence: 64
    ## Ledgers of history the RPC retains. Omit to leave HISTORY_RETENTION_WINDOW out of
    ## the config and let stellar-rpc apply its own default.
    # historyRetentionWindow: 17280

    ## Cap on how long a single getLedgers request may run, as a Go duration string
    ## ("30s", "1m"). Omit to leave MAX_GET_LEDGERS_EXECUTION_DURATION out of the config
    ## and let stellar-rpc apply its own default.
    # maxGetLedgersExecutionDuration: "30s"

    ## Read ledgers from a galexie data lake: serves getLedgers beyond the retention
    ## window, and with backfill, loads HISTORY_RETENTION_WINDOW ledgers on startup
    ## before serving. Backfill requires serveLedgersFromDatastore.
    # serveLedgersFromDatastore: true
    # backfill: true
    # datastore:
    #   type: S3
    #   params:
    #     destination_bucket_path: "aws-public-blockchain/v1.1/stellar/ledgers/pubnet"
    #     region: us-east-2

  coreConfig:
    networkPassphrase: "Test SDF Future Network ; October 2022"
    bucketlistDbIndexPageSizeExponent: 12
    failureSafety: 0
    unsafeQuorum: true
    enableDiagnosticEvents: true

    ## Where captive core writes its log file. Omit entirely to leave LOG_FILE_PATH out of the
    ## config and let stellar-core apply its own default. Set to "" to disable file logging and
    ## send logs to the container's stdout/stderr.
    # logFilePath: "/var/log/stellar/stellar-core.log"

    homeDomains:
    - homeDomain: "futurenet.stellar.org"
      quality: "MEDIUM"
    validators:
      - name: "sdf_futurenet_1"
        homeDomain: "futurenet.stellar.org"
        publicKey: "GBRIF2N52GVN3EXBBICD5F4L5VUFXK6S6VOUCF6T2DWPLOLGWEPPYZTF"
        address: "core-live-futurenet-a.stellar.org"
        history: "curl -sf http://history.stellar.org/dev/core-futurenet/core_futurenet_001/{0} -o {1}"
      - name: "sdf_futurenet_2"
        homeDomain: "futurenet.stellar.org"
        publicKey: "GAQM2MF22BYOGIF47RZ2523YK7ZL7Z3CIIX6CCPZBWWLE6KJTXMD4SLO"
        address: "core-live-futurenet-b.stellar.org"
        history: "curl -sf http://history.stellar.org/dev/core-futurenet/core_futurenet_002/{0} -o {1}"
      - name: "sdf_futurenet_3"
        homeDomain: "futurenet.stellar.org"
        publicKey: "GC2HLBHG4Z7KV73OPKZD6EWXIXM5QOIZVKN5OS4V2HISDOJC3TUORLY4"
        address: "core-live-futurenet-c.stellar.org"
        history: "curl -sf http://history.stellar.org/dev/core-futurenet/core_futurenet_003/{0} -o {1}"

  ingress:
    ## Whether to render a k8s Ingress. Set to false when exposing soroban-rpc
    ## via Gateway API HTTPRoute instead (see sorobanRpc.httpRoute).
    enabled: true

    host: example.com

    ## Optional TLS secret to use. If not set ingress will default to $releasename-cert
    # tlsSecretName: mysecret.tls

    ## ingressClassName to use for the ingress object
    # ingressClassName: myingress

    ## Additional annotations to add the Ingress template
    #annotations:
    #  cert-manager.io/cluster-issuer: "default"

  ## Controls whether soroban-rpc is exposed via Gateway API HTTPRoute
  httpRoute:
    enabled: false
    ## Reference to an existing external Gateway. Only used when gateway.enabled=false.
    ## When gateway.enabled=true, parentRefs are auto-computed from the created Gateway.
    parentRefs:
      - name: soroban-rpc-gateway
        namespace: ""  # defaults to release namespace
        sectionName: ""

    ## Listener to attach to on the Gateway created by gateway.enabled=true.
    # sectionName: https

    hostnames:
      - soroban-rpc.example.com
    ## Extra annotations to add to the HTTPRoute object
    annotations: {}
    ## Extra labels to add to the HTTPRoute object
    labels: {}

    ## Optional companion HTTPRoute that answers plain HTTP with a redirect to HTTPS.
    ## Rendered as <fullname>-http-redirect, and only when httpRoute.enabled is also true.
    httpsRedirect:
      enabled: false

      ## Reference to an existing external Gateway to attach the redirect to.
      ## Leave empty to attach to the Gateway created by gateway.enabled=true instead.
      ## Required when gateway.enabled=false.
      parentRefs: []
      # parentRefs:
      #   - name: my-shared-gateway
      #     namespace: gateway-system
      #     sectionName: web

      ## Listener on the Gateway created by gateway.enabled=true to attach the redirect to.
      ## Only used when parentRefs above is empty.
      # sectionName: web

      ## Hostnames to redirect. Defaults to httpRoute.hostnames when unset.
      # hostnames:
      #   - soroban-rpc.example.com
      ## Redirect status code. 301 permanent, 302 temporary.
      statusCode: 301
      ## Extra annotations to add to the redirect HTTPRoute object
      annotations: {}
      ## Extra labels to add to the redirect HTTPRoute object
      labels: {}

    ## Optional Gateway resource created in the same namespace
    gateway:
      enabled: false
      ## Gateway class name (e.g. "istio", "traefik")
      gatewayClassName: ""
      ## Gateway name override. Defaults to <fullname>-gateway
      name: ""
      listeners:
        - name: http
          protocol: HTTP
          port: 80
        # - name: https
        #   protocol: HTTPS
        #   port: 443
        #   hostname: soroban-rpc.example.com
        #   tls:
        #     mode: Terminate
        #     certificateRefs:
        #       - name: soroban-rpc-tls-cert
      ## Extra annotations to add to the Gateway object
      annotations: {}
      ## Extra labels to add to the Gateway object
      labels: {}

  ## Whether to provision persistent volume(PV). Recommended for production use cases and any deployment that is
  ## configured to be on the pubnet network. On pubnet network, disk requirements start at 30GB minimum,
  ## which pushes on the typical upper limit of ephemeral storage provided in cluster containers.
  ## Choosing a PV storage class available on from your cluster also allows choosing one that can provide a known
  ## performant read/write throughput, we recommend at least 3k IOPS, 5MB/sec.
  persistence:
    enabled: false
    ## Where /var/lib/stellar lives when enabled:
    ##   "pvc"       a PersistentVolumeClaim per pod (an EBS volume). The data survives a
    ##               pod restart or a move to another node. This is the default.
    ##   "emptyDir"  a directory on the node's own disk. Faster (NVMe on instance-store
    ##               nodes) but deleted when the pod leaves the node.
    ##   "hostPath"  a fixed directory on the node's own disk, mounted straight into the
    ##               pod. Survives pod restarts and image upgrades; lost when the node is
    ##               terminated, and the pod then starts empty on the new node. Needs the
    ##               namespace at Pod Security level privileged (baseline forbids hostPath).
    type: pvc
    ## Only used when type is pvc.
    storageClass: default
    size: 100G
    ## Only used when type is emptyDir. sizeLimit is a ceiling, not a reservation: when the
    ## pod writes more than this, Kubernetes evicts the pod and the directory is deleted.
    ## Leave it empty for no ceiling. To make the scheduler pick a node with enough local
    ## disk, set resources.requests.ephemeral-storage below; sizeLimit does not do that.
    emptyDir:
      sizeLimit: 100Gi
    ## Only used when type is hostPath. Each pod mounts <path>/<namespace>/<pod name>, so
    ## no two pods on a node ever share a directory, whatever their release names.
    ## Created on first use.
    ## Use nodeSelector and tolerations below to keep the pod on nodes that have the disk.
    hostPath:
      path: ""
    ## A second, large PVC for rpcv2 full-history nodes, mounted at
    ## /var/lib/stellar-cold-storage. The hot tier and the catalog stay on /var/lib/stellar
    ## (NVMe). The packed stores go here: set rpcv2Config.storage.ledgers, events,
    ## events_index, txhash_raw and txhash_index to paths under this mount.
    ## See ci/rpcv2-archive-values.yaml for the full layout.
    coldStorage:
      enabled: false
      storageClass: default
      size: 10Ti
    ## Persistent volume claim retention policy for the StatefulSet. Applies to the pvc above
    ## and to the coldStorage pvc.
    ## ref: https://kubernetes.io/docs/concepts/workloads/controllers/statefulset/#persistentvolumeclaim-retention
    # persistentVolumeClaimRetentionPolicy:
    #   whenDeleted: Retain
    #   whenScaled: Retain

  ## Soroban RPC pods do not need to be initialized in a specific order
  podManagementPolicy: Parallel

  ## Uncomment to use custom service account
  # serviceAccountName: default

  ## Additional annotations or labels to add to the pod template. Note these land on the
  ## pods, not on the StatefulSet object -- use statefulsetAnnotations for that.
  # annotations:
  #   prometheus.io/scrape: "true"
  #   prometheus.io/port: "6061"
  # labels:
  #   environment: "dev"
  #   mylabel1: "dev-value"

  ## Annotations to add to the StatefulSet object itself, for controllers that watch the
  ## workload rather than its pods.
  # statefulsetAnnotations:
  #   reloader.stakater.com/auto: "true"

  ## Uncomment to set resource limits
  # resources:
  #  limits:
  #    cpu: 2
  #    memory: 4Gi
  #  requests:
  #    cpu: 250m
  #    memory: 2Gi

  ## Example affinity
  # affinity:
  #   podAntiAffinity:
  #     requiredDuringSchedulingIgnoredDuringExecution:
  #     - labelSelector:
  #         matchLabels:
  #           app: stellar-soroban-rpc
  #       topologyKey: kubernetes.io/hostname
  affinity: {}

  ## Node selector to determine which nodes should run the pods
  ## Example nodeSelector
  # nodeSelector:
  #   kubernetes.io/os: linux
  #   node-type: soroban-rpc
  nodeSelector: {}

  ## Pod tolerations, rendered as-is. Needed to schedule on a tainted node pool.
  tolerations: []
  # tolerations:
  #   - key: dedicated
  #     operator: Equal
  #     value: rpc-v2
  #     effect: NoSchedule

  ## Example podDisruptionBudget
  # podDisruptionBudget:
  #   minAvailable: 1
  podDisruptionBudget: {}
