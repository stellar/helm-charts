global:
  # namespace: mynamespace
  network: futurenet
  networkPassphrase: "My Stellar Network 2022"
  # horizonUrl: ""
  # nameOverride:
  # fullnameOverride:

  image:
    friendbot:
      name: friendbot
      registry: docker-registry.services.stellar-ops.com
      repository: dev/friendbot
      # tag: x.x.x

      ## Defaults to 'Always' if image tag is 'latest', else set to 'IfNotPresent'
      pullPolicy: IfNotPresent

friendbot:

  # serviceAccountName: default

  deployment:
    # deploymentAnnotations:
    #   reloader.stakater.com/auto: "true"
    strategy:
      type: RollingUpdate
      # rollingUpdate:
      #   maxUnavailable: 0
      #   maxSurge: 1
    container:
      cliArgs:
      - --conf
      - /config/friendbot.conf
      - --secret
      - /secret/secret.conf
      replicaCount: 1
      startupProbe:
        tcpSocket: {}
        initialDelaySeconds: 60
        failureThreshold: 60
        periodSeconds: 10
        timeoutSeconds: 5
    # annotations:
    #   prometheus.io/scrape: "true"
    #   prometheus.io/port: "6000"
    # labels:
    #   environment: "dev"
    #   mylabel1: "myvalue1"

  ingress:
    ## Whether to render a k8s Ingress. Set to false when exposing friendbot
    ## via Gateway API HTTPRoute instead (see friendbot.httpRoute).
    enabled: true

    host: "friendbot.example.com"
    # ingressClassName: ""
    # annotations:
    #   cert-manager.io/cluster-issuer: "default"

  ## Controls whether friendbot is exposed via Gateway API HTTPRoute
  httpRoute:
    enabled: false
    ## Reference to an existing external Gateway. Only used when gateway.enabled=false.
    ## When gateway.enabled=true, parentRefs are auto-computed from the created Gateway.
    parentRefs:
      - name: friendbot-gateway
        namespace: ""  # defaults to release namespace
        sectionName: ""
    hostnames:
      - friendbot.example.com
    ## Extra annotations to add to the HTTPRoute object
    annotations: {}
    ## Extra labels to add to the HTTPRoute object
    labels: {}
    ## Optional Gateway resource created in the same namespace
    gateway:
      enabled: false
      ## Gateway class name (e.g. "istio", "traefik")
      gatewayClassName: ""
      ## Gateway name override. Defaults to <fullname>-gateway
      name: ""
      listeners:
        - name: http
          protocol: HTTP
          port: 80
        # - name: https
        #   protocol: HTTPS
        #   port: 443
        #   hostname: friendbot.example.com
        #   tls:
        #     mode: Terminate
        #     certificateRefs:
        #       - name: friendbot-tls-cert
      ## Extra annotations to add to the Gateway object
      annotations: {}
      ## Extra labels to add to the Gateway object
      labels: {}

  secret:
    ## Friendbot requires account seed to be configured. This can be provided using two mutually exclusive ways:
    ## 1. Using the friendbotAccountSeed value. The chart will create secret with the required content
    ##    If not set, chart falls back to legacy friendbot.configmap.friendbotAccountSeed
    ## 2. Using the existingSecret value. The chart will mount the secret in the Deployment.
    ##    Required format for existingSecret:
    ##    - Secret must contain a key named `secret.conf`
    ##    - That key is mounted as /secret/secret.conf (used by container args)
    ##    - secret.conf content must use: friendbot_secret = "<stellar_secret_seed>"
    # friendbotAccountSeed: "XXXXXXX"
    # existingSecret: ""

  configmap:
    port: 8000
    # friendbotAccountSeed: "XXXXXXX" # legacy fallback; prefer friendbot.secret.friendbotAccountSeed
    # otel_enabled: false
    # otel_endpoint: "http://otel-collector:4318"
    # rpc_url: "https://soroban-rpc.example.com"
    # horizon_url: "https://horizon-testnet.stellar.org"
    # starting_balance: 10000
    # num_minions: 1000
    # base_fee: 10000
    # minion_batch_size: 50
    # submit_tx_retries_allowed: 5
    # fund_contract_addresses: true

