---
name: Lint charts

on:
  pull_request:
    paths:
      - 'charts/**'
      - '.github/workflows/lint.yaml'
  push:
    branches: [main]
    paths:
      - 'charts/**'
      - '.github/workflows/lint.yaml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  helm-lint:
    name: helm lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Helm
        uses: azure/setup-helm@v5
        with:
          version: v3.18.4

      - name: Lint charts
        run: |
          set -uo pipefail
          failed=()
          for chart in charts/*/; do
            name="$(basename "$chart")"
            echo "Running helm lint on: $name"

            if grep -q '^dependencies:' "${chart}Chart.yaml"; then
              helm dependency build "$chart" || failed+=("$name (dependency build)")
            fi

            helm lint --strict "$chart" || failed+=("$name")

            echo "Finished helm lint on: $name"
          done

          if [[ ${#failed[@]} -gt 0 ]]; then
            echo "::error::helm lint failed for: ${failed[*]}"
            exit 1
          fi
          echo "All charts linted successfully."

  lint-rendered:
    name: lint rendered resources
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Helm
        uses: azure/setup-helm@v5
        with:
          version: v3.18.4

      - name: Install kubeconform
        env:
          KUBECONFORM_VERSION: '0.8.0'
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/kubeconform.tar.gz \
            "https://github.com/yannh/kubeconform/releases/download/v${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz"
          tar -xzf /tmp/kubeconform.tar.gz -C /tmp kubeconform
          sudo install -m 0755 /tmp/kubeconform /usr/local/bin/kubeconform

      - name: Validate rendered core resources
        env:
          KUBE_VERSION: '1.34.0'
          CRD_SCHEMA: 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json'
        run: |
          set -uo pipefail
          failed=()

          validate() {
            local desc="$1"; shift
            echo "Linting templated resources for core - [$desc]"
            if ! helm template core charts/core \
                 --kube-version "$KUBE_VERSION" "$@" > rendered.yaml; then
              echo "::error::helm template failed for core [$desc]"
              failed+=("$desc (render)")
              echo "Finished templating resources for core - [$desc]"
              return
            fi
            kubeconform \
              -strict \
              -summary \
              -verbose \
              -kubernetes-version "$KUBE_VERSION" \
              -schema-location default \
              -schema-location "$CRD_SCHEMA" \
              rendered.yaml || failed+=("$desc")
            echo "Finished linting templated resources for core - [$desc]"
          }

          # Stock defaults, and the alternate network config kept in the chart.
          validate defaults
          validate futurenet -f charts/core/futurenet-values.yaml

          # Everything in charts/core/ci/. These cover template branches that
          # stock defaults never take -- the history proxy and its two mutually
          # exclusive ways of being exposed. Dropping a new *-values.yaml file
          # in that directory is picked up here without editing this workflow.
          for values in charts/core/ci/*-values.yaml; do
            scenario="$(basename "$values" -values.yaml)"
            validate "$scenario" -f "$values"
          done

          if [[ ${#failed[@]} -gt 0 ]]; then
            echo "::error::rendered resource validation failed for: ${failed[*]}"
            exit 1
          fi
          echo "All rendered core resources are valid."
