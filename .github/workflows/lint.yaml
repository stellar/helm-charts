---
name: Lint charts

on:
  pull_request:
    paths:
      - 'charts/**'
      - '.github/workflows/lint.yaml'
  push:
    branches: [main]
    paths:
      - 'charts/**'
      - '.github/workflows/lint.yaml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  helm-lint:
    name: helm lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Helm
        uses: azure/setup-helm@v5
        with:
          version: v3.18.4

      - name: Lint charts
        run: |
          set -uo pipefail
          failed=()
          for chart in charts/*/; do
            name="$(basename "$chart")"
            echo "Running helm lint on: $name"

            if grep -q '^dependencies:' "${chart}Chart.yaml"; then
              helm dependency build "$chart" || failed+=("$name (dependency build)")
            fi

            helm lint --strict "$chart" || failed+=("$name")

            echo "Finished helm lint on: $name"
          done

          if [[ ${#failed[@]} -gt 0 ]]; then
            echo "::error::helm lint failed for: ${failed[*]}"
            exit 1
          fi
          echo "All charts linted successfully."

  lint-rendered:
    name: lint rendered resources (k8s ${{ matrix.kubernetes-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        kubernetes-version: ['1.34.0', '1.35.0', '1.36.0']
    steps:
      - uses: actions/checkout@v7

      - name: Set up Helm
        uses: azure/setup-helm@v5
        with:
          version: v3.18.4

      - name: Install kubeconform
        env:
          KUBECONFORM_VERSION: '0.8.0'
          KUBECONFORM_SHA256: '9bc2bffbf71f261128533edaf912153948b7ff238f9a531ae6d34466ec287883'
        run: |
          set -euo pipefail

          archive="$(mktemp -d)/kubeconform.tar.gz"
          curl -fsSL --proto '=https' --tlsv1.2 -o "$archive" \
            "https://github.com/yannh/kubeconform/releases/download/v${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz"
          echo "${KUBECONFORM_SHA256}  ${archive}" | sha256sum -c -

          tar -xzf "$archive" -C "$(dirname "$archive")" kubeconform
          sudo install -m 0755 "$(dirname "$archive")/kubeconform" /usr/local/bin/kubeconform
          kubeconform -v

      - name: Validate rendered resources
        env:
          KUBE_VERSION: ${{ matrix.kubernetes-version }}
          # Pinned ref: datreeio/CRDs-catalog @ ad3b08c (2026-09-08). To bump,
          # replace the commit in the URL below.
          CRD_SCHEMA: 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/ad3b08c5045129d7bb1eeffd8e61719b2c8dd1e2/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json'
        run: |
          set -uo pipefail
          # Globs that match nothing must expand to nothing, not to the literal
          # pattern, or a chart without a ci/ directory would be handed a
          # bogus values path.
          shopt -s nullglob
          failed=()

          validate() {
            local chart="$1" scenario="$2" values="$3"
            echo "Linting templated resources for $chart - [$scenario]"
            if ! helm template "$chart" "charts/$chart" \
                 --kube-version "$KUBE_VERSION" --values "$values" > rendered.yaml; then
              echo "::error::helm template failed for $chart [$scenario]"
              failed+=("$chart/$scenario (render)")
              return
            fi
            kubeconform \
              -strict \
              -summary \
              -verbose \
              -kubernetes-version "$KUBE_VERSION" \
              -schema-location default \
              -schema-location "$CRD_SCHEMA" \
              rendered.yaml || failed+=("$chart/$scenario")
            echo "Finished linting templated resources for $chart - [$scenario]"
          }

          for chart_dir in charts/*/; do
            chart="$(basename "$chart_dir")"

            # Subchart dependencies have to be vendored before the chart will
            # render at all.
            if grep -q '^dependencies:' "${chart_dir}Chart.yaml"; then
              if ! helm dependency build "$chart_dir"; then
                echo "::error::helm dependency build failed for $chart"
                failed+=("$chart (dependency build)")
                continue
              fi
            fi

            scenarios=0
            for values in "${chart_dir}ci/"*-values.yaml "${chart_dir}"*values*.yaml; do
              # The chart's own defaults, already covered by ci/default-values.yaml.
              [[ "$(basename "$values")" == "values.yaml" ]] && continue
              validate "$chart" "$(basename "$values" .yaml)" "$values"
              scenarios=$((scenarios + 1))
            done

            # Add default-values for a new chart
            if [[ $scenarios -eq 0 ]]; then
              echo "::error::$chart has no lint scenarios - add charts/$chart/ci/default-values.yaml"
              failed+=("$chart (no scenarios)")
            fi
          done

          if [[ ${#failed[@]} -gt 0 ]]; then
            echo "::error::rendered resource validation failed for: ${failed[*]}"
            exit 1
          fi
          echo "All rendered resources are valid."
