---
name: Lint charts

on:
  pull_request:
    paths:
      - 'charts/**'
      - '.github/workflows/lint.yaml'
  push:
    branches: [main]
    paths:
      - 'charts/**'
      - '.github/workflows/lint.yaml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  helm-lint:
    name: helm lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Helm
        uses: azure/setup-helm@v5
        with:
          version: v3.18.4

      - name: Lint charts
        run: |
          set -uo pipefail
          failed=()
          for chart in charts/*/; do
            name="$(basename "$chart")"
            echo "Running helm lint on: $name"

            if grep -q '^dependencies:' "${chart}Chart.yaml"; then
              helm dependency build "$chart" || failed+=("$name (dependency build)")
            fi

            helm lint --strict "$chart" || failed+=("$name")

            echo "Finished helm lint on: $name"
          done

          if [[ ${#failed[@]} -gt 0 ]]; then
            echo "::error::helm lint failed for: ${failed[*]}"
            exit 1
          fi
          echo "All charts linted successfully."

  lint-rendered:
    name: lint rendered resources
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Helm
        uses: azure/setup-helm@v5
        with:
          version: v3.18.4

      - name: Install kubeconform
        env:
          KUBECONFORM_VERSION: '0.8.0'
          KUBECONFORM_SHA256: '9bc2bffbf71f261128533edaf912153948b7ff238f9a531ae6d34466ec287883'
        run: |
          set -euo pipefail

          archive="$(mktemp -d)/kubeconform.tar.gz"
          curl -fsSL --proto '=https' --tlsv1.2 -o "$archive" \
            "https://github.com/yannh/kubeconform/releases/download/v${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz"
          echo "${KUBECONFORM_SHA256}  ${archive}" | sha256sum -c -

          tar -xzf "$archive" -C "$(dirname "$archive")" kubeconform
          sudo install -m 0755 "$(dirname "$archive")/kubeconform" /usr/local/bin/kubeconform
          kubeconform -v

      - name: Validate rendered core resources
        env:
          KUBE_VERSION: '1.34.0'
          # Pinned ref: datreeio/CRDs-catalog @ ad3b08c (2026-09-08). To bump,
          # replace the commit in the URL below.
          CRD_SCHEMA: 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/ad3b08c5045129d7bb1eeffd8e61719b2c8dd1e2/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json'
        run: |
          set -uo pipefail
          failed=()

          validate() {
            local desc="$1"; shift
            echo "Linting templated resources for core - [$desc]"
            if ! helm template core charts/core \
                 --kube-version "$KUBE_VERSION" "$@" > rendered.yaml; then
              echo "::error::helm template failed for core [$desc]"
              failed+=("$desc (render)")
              echo "Finished templating resources for core - [$desc]"
              return
            fi
            kubeconform \
              -strict \
              -summary \
              -verbose \
              -kubernetes-version "$KUBE_VERSION" \
              -schema-location default \
              -schema-location "$CRD_SCHEMA" \
              rendered.yaml || failed+=("$desc")
            echo "Finished linting templated resources for core - [$desc]"
          }

          # Stock defaults, and the alternate network config kept in the chart.
          validate defaults
          validate futurenet -f charts/core/futurenet-values.yaml

          # Values files in in charts/<name>/ci/ contain more scenarios to make sure the
          # full range of resources are templated and linted. 
          for values in charts/core/ci/*-values.yaml; do
            scenario="$(basename "$values" -values.yaml)"
            validate "$scenario" -f "$values"
          done

          if [[ ${#failed[@]} -gt 0 ]]; then
            echo "::error::rendered resource validation failed for: ${failed[*]}"
            exit 1
          fi
          echo "All rendered core resources are valid."
